[project]
name = "ganpati-asset-pipeline"
version = "0.1.0"
description = "Deterministic validation and golden rendering for Ganpati Studio Asset Packs"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
  "Pillow==12.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ganpati_asset_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
